          - generic [ref=f34e188]:
            - generic [ref=f34e189]:
              - generic [ref=f34e190]: "1"
              - generic [ref=f34e191]:
                - paragraph [ref=f34e192]: School exports consented numbers
                - paragraph [ref=f34e193]: After enrollment forms are collected, the school administrator exports the phone numbers of consented parents and guardians into a CSV file.
            - generic [ref=f34e194]:
              - generic [ref=f34e195]: "2"
              - generic [ref=f34e196]:
                - paragraph [ref=f34e197]: Administrator imports to Kesher with certification
                - paragraph [ref=f34e198]: The administrator uploads the CSV to Kesher. Before any numbers are saved, they must check a certification box confirming that all contacts have explicitly consented to receive SMS from the school.
            - generic [ref=f34e199]:
              - generic [ref=f34e200]: "3"
              - generic [ref=f34e201]:
                - paragraph [ref=f34e202]: Kesher records the import and consent certification
                - paragraph [ref=f34e203]: Kesher logs the import timestamp, the administrator's identity, and the certification acknowledgment. This creates an auditable consent trail.
            - generic [ref=f34e204]:
              - generic [ref=f34e205]: "4"
              - generic [ref=f34e206]:
                - paragraph [ref=f34e207]: School sends messages; STOP/HELP handled automatically
                - paragraph [ref=f34e208]: School administrators send campaigns through Kesher. Every message automatically includes opt-out instructions. STOP, HELP, and UNSTOP are processed in real time with no manual intervention.
