              - generic [ref=f32e191]:
                - paragraph [ref=f32e192]: School exports consented numbers
                - paragraph [ref=f32e193]: After enrollment forms are collected, the school administrator exports the phone numbers of consented parents and guardians into a CSV file.
            - generic [ref=f32e194]:
              - generic [ref=f32e195]: "2"
              - generic [ref=f32e196]:
                - paragraph [ref=f32e197]: Administrator imports to Kesher with certification
                - paragraph [ref=f32e198]: The administrator uploads the CSV to Kesher. Before any numbers are saved, they must check a certification box confirming that all contacts have explicitly consented to receive SMS from the school.
            - generic [ref=f32e199]:
              - generic [ref=f32e200]: "3"
              - generic [ref=f32e201]:
                - paragraph [ref=f32e202]: Kesher records the import and consent certification
                - paragraph [ref=f32e203]: Kesher logs the import timestamp, the administrator's identity, and the certification acknowledgment. This creates an auditable consent trail.
            - generic [ref=f32e204]:
              - generic [ref=f32e205]: "4"
              - generic [ref=f32e206]:
                - paragraph [ref=f32e207]: School sends messages; STOP/HELP handled automatically
                - paragraph [ref=f32e208]: School administrators send campaigns through Kesher. Every message automatically includes opt-out instructions. STOP, HELP, and UNSTOP are processed in real time with no manual intervention.
