              - generic [ref=f61e143]:
                - paragraph [ref=f61e144]: School exports consented numbers
                - paragraph [ref=f61e145]: After enrollment forms are collected, the school administrator exports the phone numbers of consented parents and guardians into a CSV file.
            - generic [ref=f61e146]:
              - generic [ref=f61e147]: "2"
              - generic [ref=f61e148]:
                - paragraph [ref=f61e149]: Administrator imports to Kesher with certification
                - paragraph [ref=f61e150]: The administrator uploads the CSV to Kesher. Before any numbers are saved, they must check a certification box confirming that all contacts have explicitly consented to receive SMS from the school.
            - generic [ref=f61e151]:
              - generic [ref=f61e152]: "3"
              - generic [ref=f61e153]:
                - paragraph [ref=f61e154]: Kesher records the import and consent certification
                - paragraph [ref=f61e155]: Kesher logs the import timestamp, the administrator's identity, and the certification acknowledgment. This creates an auditable consent trail.
            - generic [ref=f61e156]:
              - generic [ref=f61e157]: "4"
              - generic [ref=f61e158]:
                - paragraph [ref=f61e159]: School sends messages; STOP/HELP handled automatically
                - paragraph [ref=f61e160]: School administrators send campaigns through Kesher. Every message automatically includes opt-out instructions. STOP, HELP, and UNSTOP are processed in real time with no manual intervention.
