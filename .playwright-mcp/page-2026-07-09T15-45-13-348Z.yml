            - paragraph [ref=f8e135]:
              - text: For SMS opt-out, reply
              - strong [ref=f8e136]: STOP
              - text: to any message, or email us at
              - link "privacy@kesherhq.co" [ref=f8e137] [cursor=pointer]:
                - /url: mailto:privacy@kesherhq.co
              - text: with your phone number and the school name.
