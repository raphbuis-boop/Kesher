          - generic [ref=f63e128]:
            - generic [ref=f63e129]:
              - generic [ref=f63e130]: "1"
              - generic [ref=f63e131]:
                - paragraph [ref=f63e132]: School exports consented numbers
                - paragraph [ref=f63e133]: After enrollment forms are collected, the school administrator exports the phone numbers of consented parents and guardians into a CSV file.
            - generic [ref=f63e134]:
              - generic [ref=f63e135]: "2"
              - generic [ref=f63e136]:
                - paragraph [ref=f63e137]: Administrator imports to Kesher with certification
                - paragraph [ref=f63e138]: The administrator uploads the CSV to Kesher. Before any numbers are saved, they must check a certification box confirming that all contacts have explicitly consented to receive SMS from the school.
            - generic [ref=f63e139]:
              - generic [ref=f63e140]: "3"
              - generic [ref=f63e141]:
                - paragraph [ref=f63e142]: Kesher records the import and consent certification
                - paragraph [ref=f63e143]: Kesher logs the import timestamp, the administrator's identity, and the certification acknowledgment. This creates an auditable consent trail.
            - generic [ref=f63e144]:
              - generic [ref=f63e145]: "4"
              - generic [ref=f63e146]:
                - paragraph [ref=f63e147]: School sends messages; STOP/HELP handled automatically
                - paragraph [ref=f63e148]: School administrators send campaigns through Kesher. Every message automatically includes opt-out instructions. STOP, HELP, and UNSTOP are processed in real time with no manual intervention.
