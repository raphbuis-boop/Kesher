                      - text: for more info.
                  - row "CR4014 Call-to-action does not contain robust age gate for age-restricted message program (alcohol/firearms/tobacco) Message content related to age restricted goods, such as alcohol or tobacco, is not permitted without an age gate mechanism. An acceptable age gate would consist of, at minimum, a recipient entering a day, month, and year confirming their age at messaging opt-in prior to receiving messaging. If the call-to-action indicates that the message program will be sending this type of content, and no age gate is in place, the campaign will be rejected. Implement age gate and resubmit." [ref=f47e306]:
