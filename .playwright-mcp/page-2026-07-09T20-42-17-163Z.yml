              - paragraph [ref=f47e95]:
                - text: Before you launch your 10DLC message program, Sinch must review your campaign to make sure your message program aligns with carrier and industry requirements. Principally we look for alignment with
                - link "CTIA Messaging Principles and Best Practices" [ref=f47e96] [cursor=pointer]:
                  - /url: https://community.sinch.com/t5/SMS/CTIA-Messaging-Principles-and-Best-Practices/ta-p/7087?attachment-id=1107
                - generic [ref=f47e97]:
                  - text: . For more details on 10DLC campaign requirements, refer to
                  - link "10DLC Compliance Requirements and Guidance." [ref=f47e98] [cursor=pointer]:
                    - /url: https://community.sinch.com/t5/10DLC/10DLC-Compliance-Requirements-and-Guidance/ta-p/10706
              - paragraph [ref=f47e99]
              - paragraph [ref=f47e100]: If Sinch rejects your 10DLC campaign, we will provide a rejection code with a description. In most cases, after addressing the reason for the rejection, you can resubmit your campaign to Sinch for review.*
              - paragraph [ref=f47e101]: "Rejection codes are grouped into categories based on the part of the 10DLC campaign that they relate to:"
              - list [ref=f47e102]:
                - listitem [ref=f47e103]: Brand Inconsistencies
                - listitem [ref=f47e104]: Campaign
                - listitem [ref=f47e105]: Call-to-Action
                - listitem [ref=f47e106]: Terms and Conditions
                - listitem [ref=f47e107]: Privacy Policy
                - listitem [ref=f47e108]: Mandatory Messages
                - listitem [ref=f47e109]: Sample Messages
                - listitem [ref=f47e110]: Disallowed Content.
              - paragraph [ref=f47e111]
              - paragraph [ref=f47e112]: "Details of the rejection codes and descriptions for each of these categories can be found in the tables below:"
              - paragraph [ref=f47e113]
              - table [ref=f47e114]:
