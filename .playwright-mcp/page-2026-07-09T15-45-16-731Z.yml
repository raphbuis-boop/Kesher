            - heading "Limitation of Liability" [level=2] [ref=f9e64]
            - paragraph [ref=f9e65]: Kesher is not liable for any delays or failures in the receipt of SMS messages. Delivery is subject to valid mobile service coverage and carrier network conditions. Carriers reserve the right to refuse, alter, or terminate any SMS service at any time.
