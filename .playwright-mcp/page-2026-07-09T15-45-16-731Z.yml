          - generic [ref=f9e23]:
            - heading "Program Description" [level=2] [ref=f9e24]
            - paragraph [ref=f9e25]: Kesher ("Kesher") provides a school communications platform that enables educational institutions to send SMS text messages to their communities — including parents, guardians, students, staff, alumni, and other authorized school community members.
            - paragraph [ref=f9e26]: "Messages sent through Kesher may include: school event notifications, emergency alerts, attendance reminders, administrative announcements, schedule updates, fundraising information, and general school communications. Messages are sent on behalf of your school. The school name or identifier will be included in each message."
          - generic [ref=f9e27]:
            - heading "Consent to Receive Messages" [level=2] [ref=f9e28]
            - paragraph [ref=f9e29]: You are receiving SMS messages because your school has your phone number on file and has indicated that you have consented to receive communications from your school community. Your school is responsible for obtaining and maintaining appropriate consent from its community members.
            - paragraph [ref=f9e30]: By not opting out, you confirm that you consent to receive SMS text messages from your school via the Kesher platform. Consent is not a condition of any purchase or enrollment.
          - generic [ref=f9e31]:
            - heading "Message Frequency" [level=2] [ref=f9e32]
            - paragraph [ref=f9e33]: Message frequency varies based on your school's activity and communication needs. You may receive multiple messages per week during active school periods.
          - generic [ref=f9e34]:
            - heading "Message and Data Rates" [level=2] [ref=f9e35]
            - paragraph [ref=f9e36]:
              - strong [ref=f9e37]: Message and data rates may apply.
              - text: Please check with your mobile service provider for details about your plan's SMS rates. Kesher and your school do not charge a fee for SMS messages, but your carrier may.
            - paragraph [ref=f9e38]: Participating carriers include AT&T, T-Mobile, Verizon, and others. Carrier availability and rates may vary. Carriers are not liable for delayed or undelivered messages.
          - generic [ref=f9e39]:
            - heading "How to Opt Out (STOP)" [level=2] [ref=f9e40]
            - paragraph [ref=f9e41]:
              - text: You may opt out of SMS messages at any time by replying
              - strong [ref=f9e42]: STOP
              - text: to any text message. After opting out, you will receive one final confirmation message and no further messages will be sent to your number.
            - paragraph [ref=f9e43]: Opt-out requests are processed immediately. STOP, STOPALL, UNSUBSCRIBE, CANCEL, END, and QUIT are all recognized opt-out keywords.
            - paragraph [ref=f9e44]:
              - text: To re-subscribe after opting out, reply
              - strong [ref=f9e45]: UNSTOP
              - text: or
              - strong [ref=f9e46]: START
              - text: .
          - generic [ref=f9e47]:
