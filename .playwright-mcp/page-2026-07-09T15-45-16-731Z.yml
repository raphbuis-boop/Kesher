                  - /url: https://www.kesherhq.co
            - paragraph [ref=f9e56]: For issues with messages from a specific school, please contact your school's administrative office directly.
          - generic [ref=f9e57]:
            - heading "Your Phone Number and Privacy" [level=2] [ref=f9e58]
            - paragraph [ref=f9e59]: No mobile information will be shared with third parties or affiliates for marketing or promotional purposes.
            - paragraph [ref=f9e60]: All other categories of information described in our Privacy Policy exclude text messaging originator opt-in data and consent; this information will not be shared with any third parties.
