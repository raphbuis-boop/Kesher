            - paragraph [ref=f42e521]: Common Questions
            - generic [ref=f42e522]:
              - paragraph [ref=f42e523]: Is Kesher available to any school?
              - paragraph [ref=f42e524]: Yes. Kesher is built for K–12 schools, yeshivas, community schools, and educational organizations of any size. We work with schools directly to get them onboarded.
            - generic [ref=f42e525]:
              - paragraph [ref=f42e526]: How does consent work for SMS?
              - paragraph [ref=f42e527]: Every school must certify at import that each contact has provided explicit written or digital consent to receive SMS messages. Kesher enforces this before any number can be imported.
            - generic [ref=f42e528]:
              - paragraph [ref=f42e529]: What happens when someone replies STOP?
              - paragraph [ref=f42e530]: Opt-out requests are processed in real time. The number is permanently suppressed from all future sends for that school and a confirmation message is sent automatically.
