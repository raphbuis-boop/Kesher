        - generic [ref=f42e215]:
          - generic [ref=f42e216]:
            - paragraph [ref=f42e217]: Platform
            - heading "Everything your school needs to stay connected" [level=2] [ref=f42e218]
            - paragraph [ref=f42e219]: Kesher replaces the patchwork of email blasts, group texts, and manual lists that most schools rely on. One platform, every channel, for every part of your community.
          - generic [ref=f42e220]:
            - generic [ref=f42e221]:
              - img [ref=f42e223]
              - heading "One contact directory" [level=3] [ref=f42e228]
              - paragraph [ref=f42e229]: Import your school's contact list and organize it by role — parents, students, staff, alumni, board members, and donors. Every contact in one place, always up to date.
            - generic [ref=f42e230]:
              - img [ref=f42e232]
              - heading "Simple message campaigns" [level=3] [ref=f42e235]
              - paragraph [ref=f42e236]: Write a message, choose your audience, pick a channel, and send. Track delivery, opens, and failures in real time. Every campaign is saved with its full history.
            - generic [ref=f42e237]:
              - img [ref=f42e239]
              - heading "Audiences and groups" [level=3] [ref=f42e243]
              - paragraph [ref=f42e244]: Create custom audience segments — grade level, homeroom, specific families. Message exactly who needs to hear from you, without copy-pasting lists.
          - generic [ref=f42e245]:
            - paragraph [ref=f42e246]: Supported Channels
            - generic [ref=f42e247]:
              - generic [ref=f42e248]:
                - img [ref=f42e250]
                - generic [ref=f42e252]:
                  - paragraph [ref=f42e253]: SMS
                  - paragraph [ref=f42e254]: Text messages sent via a 10DLC-registered long code. Opt-outs handled in real time.
              - generic [ref=f42e255]:
                - img [ref=f42e257]
                - generic [ref=f42e260]:
                  - paragraph [ref=f42e261]: Email
                  - paragraph [ref=f42e262]: HTML and plain-text email with delivery confirmation and open rate tracking.
              - generic [ref=f42e263]:
                - img [ref=f42e265]
                - generic [ref=f42e267]:
                  - paragraph [ref=f42e268]: WhatsApp
                  - paragraph [ref=f42e269]: WhatsApp Business messaging for school communities that prefer it.
        - generic [ref=f42e271]:
          - generic [ref=f42e272]:
            - paragraph [ref=f42e273]: How It Works
            - heading "From contact list to delivered message in minutes" [level=2] [ref=f42e274]
            - paragraph [ref=f42e275]: Kesher is designed for school administrators, not developers. No setup complexity, no integrations to configure.
          - generic [ref=f42e276]:
            - generic [ref=f42e277]:
              - generic [ref=f42e278]: "01"
              - heading "Import your contact list" [level=3] [ref=f42e280]
              - paragraph [ref=f42e281]: Upload a CSV of your school community. Before any number is saved, you certify that every person has opted in to receive messages from your school. Kesher enforces this at every import.
            - generic [ref=f42e282]:
              - generic [ref=f42e283]: "02"
              - heading "Compose your message" [level=3] [ref=f42e285]
              - paragraph [ref=f42e286]: Write your message, select an audience — Parents, Staff, All Families — and choose the channel. Preview before sending. Every send requires a deliberate confirmation.
            - generic [ref=f42e287]:
              - generic [ref=f42e288]: "03"
              - heading "Send and track delivery" [level=3] [ref=f42e290]
              - paragraph [ref=f42e291]: "Kesher delivers your message and tracks every result: delivered, opened, failed, or opted out. Unsubscribes are processed automatically and are permanent."
          - generic [ref=f42e292]:
            - img [ref=f42e293]
            - generic [ref=f42e295]:
              - paragraph [ref=f42e296]: Consent certification is required before any import
              - paragraph [ref=f42e297]: Before any phone numbers enter Kesher, the school administrator must certify that every person on the list has provided explicit written or digital consent to receive SMS messages. This is enforced at every import — not optional.
        - generic [ref=f42e300]:
          - generic [ref=f42e301]:
            - paragraph [ref=f42e302]: About Kesher
            - heading "Built because schools deserve better than group texts and mass emails" [level=2] [ref=f42e303]
            - generic [ref=f42e304]:
              - paragraph [ref=f42e305]: Most schools communicate through a patchwork of tools — a group text thread here, a Mailchimp blast there, an automated robocall for emergencies. None of them were designed with schools in mind, and none of them talk to each other.
              - paragraph [ref=f42e306]: Kesher was built to solve exactly that. One platform that manages your school's contact directory, lets you compose and send messages across SMS, email, and WhatsApp, and handles all the compliance requirements that come with modern messaging — so your administrators don't have to.
              - paragraph [ref=f42e307]:
                - text: The name
                - emphasis [ref=f42e308]: Kesher
                - text: "means \"connection\" in Hebrew. That's what we're building: genuine, reliable connections between schools and the families and communities they serve."
          - generic [ref=f42e309]:
            - paragraph [ref=f42e310]: Who Kesher Is For
            - generic [ref=f42e311]:
              - generic [ref=f42e312]:
                - paragraph [ref=f42e313]: School Principals & Administrators
                - paragraph [ref=f42e314]: Send school-wide announcements, emergency alerts, and event reminders without needing a communications team.
              - generic [ref=f42e315]:
                - paragraph [ref=f42e316]: Communications & Outreach Staff
                - paragraph [ref=f42e317]: Manage your contact directory, create audience segments, and run campaigns for specific groups — grade level, homeroom, department.
              - generic [ref=f42e318]:
                - paragraph [ref=f42e319]: K–12 Schools and Educational Organizations
                - paragraph [ref=f42e320]: Day schools, yeshivas, community schools, after-school programs — any educational institution that needs to communicate reliably with its community.
        - generic [ref=f42e322]:
          - generic [ref=f42e323]:
            - paragraph [ref=f42e324]: What Gets Sent
            - heading "School communications, not marketing" [level=2] [ref=f42e325]
            - paragraph [ref=f42e326]: Kesher is used exclusively for transactional and informational school communications. The platform does not support marketing, promotional, political, or commercial messaging of any kind.
