          - generic [ref=f42e371]:
            - paragraph [ref=f42e372]: Compliance
            - heading "Meets carrier and regulatory standards" [level=2] [ref=f42e373]
            - paragraph [ref=f42e374]: Every SMS message sent through Kesher complies with CTIA Messaging Principles and Best Practices, TCPA requirements, and 10DLC registration guidelines. Kesher acts as a messaging service provider; each school is the Message Originator and is responsible for obtaining and maintaining consent records.
          - generic [ref=f42e375]:
            - generic [ref=f42e377]:
              - img [ref=f42e379]
              - generic [ref=f42e382]:
                - heading "A2P 10DLC Registered" [level=3] [ref=f42e383]
                - paragraph [ref=f42e384]: Kesher operates as a registered A2P 10DLC messaging platform for school communications. All SMS is sent from a dedicated campaign registered with The Campaign Registry (TCR).
            - generic [ref=f42e386]:
              - img [ref=f42e388]
              - generic [ref=f42e391]:
                - heading "CTIA-Compliant" [level=3] [ref=f42e392]
                - paragraph [ref=f42e393]: Every outbound SMS message includes compliant STOP and HELP instructions. Opt-out requests are processed immediately and suppress that number from all future sends — permanently.
            - generic [ref=f42e395]:
              - img [ref=f42e397]
              - generic [ref=f42e400]:
                - heading "School-Facilitated Opt-In" [level=3] [ref=f42e401]
                - paragraph [ref=f42e402]: Schools certify at import that every contact has provided explicit written or digital consent. Kesher enforces this certification before any phone number can be imported.
            - generic [ref=f42e404]:
              - img [ref=f42e406]
              - generic [ref=f42e409]:
                - heading "No Third-Party Data Sharing" [level=3] [ref=f42e410]
                - paragraph [ref=f42e411]: Mobile information is never shared with third parties or affiliates for marketing or promotional purposes. Text messaging opt-in data and consent records are not shared with anyone.
