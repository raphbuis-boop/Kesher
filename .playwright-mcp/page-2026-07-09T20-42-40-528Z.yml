                      - cell "projectId" [ref=f52e113]
                      - cell "Sinch uses projects to group contacts and apps together to manage and connect a unique set of keys and secret IDs for all your Sinch API products. To identify a project, it is given a unique alphanumeric identifier that ties it to your account. Your project ID can be found in the Sinch Build Dashboard." [ref=f52e114]:
