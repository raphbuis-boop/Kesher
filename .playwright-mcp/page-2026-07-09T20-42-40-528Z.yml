              - generic [ref=f52e95]:
                - text: Before you launch your 10DLC message program, Sinch must review your campaign. We make sure your message program aligns with carrier and industry requirements. Principally we look for alignment with the
                - link "CTIA Messaging Principals & Best Practices" [ref=f52e96] [cursor=pointer]:
                  - /url: https://community.sinch.com/t5/SMS/CTIA-Messaging-Principles-and-Best-Practices/ta-p/7087/highlight/true
                - text: .
              - generic [ref=f52e98]: "Here are the top reasons Sinch may reject your campaign, and what you should do to avoid them:"
              - list [ref=f52e99]:
                - listitem [ref=f52e100]: "Insufficient opt-in: This means that you failed to convey how you get consent from the end user to send messages. Make sure you show the opt-in from the end-user's perspective. For example, if your opt-in happens online, you must specify where on the website the opt-in occurs."
                - listitem [ref=f52e101]: "Brand name mismatch: This means the registered brand name or DBA doesn't match the name on the brand website or in the messages. You can use a shortened brand name in your messages, but it can't be so different that it's not clear who the sender is. If the brand names are different, make sure you explain why in the campaign description."
                - listitem [ref=f52e102]: "Insufficient privacy policy: This means it's not clear in your privacy policy that you won't share or sell the end user’s personal info to a third party for marketing purposes. If you don't have a privacy policy, then you need to create one."
              - generic [ref=f52e103]: "In order to submit the most compliant campaign possible, Sinch has outlined below all of the fields needed to register a 10DLC Campaign. We want to give you guidance on how to submit the best 10DLC campaign possible, so that you don't encounter rejections from Sinch. All fields are required unless otherwise noted:"
              - generic [ref=f52e104]:
