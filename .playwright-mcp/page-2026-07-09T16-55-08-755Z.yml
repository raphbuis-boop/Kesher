              - paragraph [ref=f41e17]: The modern communications platform for schools.
          - heading "SMS Opt-In Documentation" [level=1] [ref=f41e18]
          - generic [ref=f41e19]:
            - paragraph [ref=f41e20]: Effective July 6, 2026
            - paragraph [ref=f41e21]: Last Updated July 6, 2026
        - generic [ref=f41e22]:
          - generic [ref=f41e23]:
            - heading "1. Purpose" [level=2] [ref=f41e24]
            - paragraph [ref=f41e25]: This document describes the SMS opt-in process for the Kesher school communications platform. It is intended to satisfy the opt-in documentation requirements of The Campaign Registry (TCR), US wireless carriers, CTIA Messaging Principles and Best Practices, and the Telephone Consumer Protection Act (TCPA).
            - paragraph [ref=f41e26]: Kesher operates an A2P (Application-to-Person) 10DLC SMS messaging platform. All SMS messages are sent on behalf of educational institutions (schools). Schools are the Message Originators and are solely responsible for collecting, documenting, and maintaining consent from their message recipients.
          - generic [ref=f41e27]:
            - heading "2. Consent Model" [level=2] [ref=f41e28]
            - paragraph [ref=f41e29]:
              - text: Kesher uses a
              - strong [ref=f41e30]: school-facilitated explicit single opt-in model
              - text: ". The consent chain operates as follows:"
            - generic [ref=f41e31]:
              - generic [ref=f41e32]:
                - generic [ref=f41e33]: "1"
                - generic [ref=f41e34]:
                  - paragraph [ref=f41e35]: School Collects Consent
                  - paragraph [ref=f41e36]: The school (Message Originator) collects explicit written or digital SMS consent directly from the recipient via an enrollment form, parent portal, onboarding document, or equivalent consent mechanism. The consent clearly identifies the school as the sender, describes the message types, and includes all required CTIA disclosures (message frequency, msg & data rates, opt-out instructions, privacy policy link).
              - generic [ref=f41e37]:
                - generic [ref=f41e38]: "2"
                - generic [ref=f41e39]:
                  - paragraph [ref=f41e40]: School Imports Contacts to Kesher
                  - paragraph [ref=f41e41]: The school administrator imports consented phone numbers into the Kesher platform via CSV upload or manual entry. At the time of import, the administrator is required to affirmatively certify that all imported contacts have provided explicit consent to receive SMS messages from the school.
              - generic [ref=f41e42]:
                - generic [ref=f41e43]: "3"
                - generic [ref=f41e44]:
                  - paragraph [ref=f41e45]: Kesher Records and Processes Consent
                  - paragraph [ref=f41e46]: Upon import, Kesher records the timestamp, importing administrator, and the certification acknowledgment in its database. This creates an auditable record that consent was certified at the time of import.
              - generic [ref=f41e47]:
                - generic [ref=f41e48]: "4"
                - generic [ref=f41e49]:
                  - paragraph [ref=f41e50]: Messages Are Sent
                  - paragraph [ref=f41e51]: School administrators compose and send SMS campaigns through Kesher to consented recipients. Kesher automatically appends "Reply STOP to opt out." to every outbound SMS message.
              - generic [ref=f41e52]:
                - generic [ref=f41e53]: "5"
                - generic [ref=f41e54]:
                  - paragraph [ref=f41e55]: Opt-Outs Are Processed Immediately
                  - paragraph [ref=f41e56]: Any recipient who replies STOP (or another recognized opt-out keyword) is immediately removed from all future messaging for that school. The opt-out is recorded in Kesher's suppression list and is permanent unless the recipient re-subscribes by replying UNSTOP or START.
          - generic [ref=f41e57]:
            - heading "3. Opt-In Verification" [level=2] [ref=f41e58]
            - paragraph [ref=f41e59]: "Kesher's platform enforces the following technical controls to prevent messaging of non-consented recipients:"
            - list [ref=f41e60]:
              - listitem [ref=f41e61]:
                - strong [ref=f41e62]: "Import certification gate:"
                - text: School administrators cannot complete a contact import without affirmatively clicking a certification checkbox confirming that all imported contacts have consented.
              - listitem [ref=f41e63]:
                - strong [ref=f41e64]: "Opted-out suppression:"
                - text: Kesher automatically checks every recipient against its suppression list before sending any message. Opted-out phone numbers are silently skipped and are never re-messaged.
              - listitem [ref=f41e65]:
                - strong [ref=f41e66]: "STOP keyword processing:"
                - text: Inbound STOP, STOPALL, UNSUBSCRIBE, CANCEL, END, and QUIT replies are processed automatically and in real time, with no manual intervention required.
              - listitem [ref=f41e67]:
                - strong [ref=f41e68]: "Audit trail:"
                - text: All import events, certification acknowledgments, and opt-out records are stored with timestamps and administrator identity.
          - generic [ref=f41e69]:
            - heading "4. Automated Keyword Responses" [level=2] [ref=f41e70]
            - paragraph [ref=f41e71]: "The following automated responses are sent by Kesher for standard messaging keywords:"
            - generic [ref=f41e72]:
              - generic [ref=f41e73]:
                - paragraph [ref=f41e74]: STOP Response (opt-out confirmation)
                - paragraph [ref=f41e75]: "\"You have been unsubscribed from [School Name] via Kesher. No further messages will be sent to this number. Reply UNSTOP to re-subscribe.\""
              - generic [ref=f41e76]:
                - paragraph [ref=f41e77]: HELP Response (support information)
                - paragraph [ref=f41e78]: "“[School Name] via Kesher School Comms. For support: help@kesherhq.co or https://www.kesherhq.co. Msg & data rates may apply. Reply STOP to opt out.”"
              - generic [ref=f41e79]:
                - paragraph [ref=f41e80]: UNSTOP / START Response (re-subscribe confirmation)
                - paragraph [ref=f41e81]: "\"You have been re-subscribed to [School Name] via Kesher. Messages will resume. Msg & data rates may apply. Reply STOP to opt out at any time.\""
          - generic [ref=f41e82]:
            - heading "5. Consent Record Keeping" [level=2] [ref=f41e83]
            - paragraph [ref=f41e84]: "Consent records are maintained as follows:"
            - list [ref=f41e85]:
              - listitem [ref=f41e86]:
                - strong [ref=f41e87]: "School-side records:"
                - text: The school is responsible for maintaining the original consent documentation (enrollment forms, digital opt-in records, etc.) and must provide these records upon request.
              - listitem [ref=f41e88]:
                - strong [ref=f41e89]: "Kesher import records:"
                - text: Kesher records the import timestamp, administrator identity, and certification acknowledgment for every contact import event.
              - listitem [ref=f41e90]:
                - strong [ref=f41e91]: "Opt-out records:"
                - text: Kesher retains a permanent suppression list of all opted-out phone numbers. These records are never deleted and are applied globally to prevent re-messaging.
              - listitem [ref=f41e92]:
                - strong [ref=f41e93]: "Inbound message logs:"
                - text: Kesher records all inbound messages (including STOP, HELP, and UNSTOP replies) with timestamps for compliance audit purposes.
          - generic [ref=f41e94]:
            - heading "6. Message Footer" [level=2] [ref=f41e95]
            - paragraph [ref=f41e96]: "Kesher automatically appends the following opt-out footer to every outbound SMS message:"
            - paragraph [ref=f41e98]: Reply STOP to opt out.
            - paragraph [ref=f41e99]: This footer is appended automatically and cannot be removed by school administrators, ensuring that every recipient is aware of their right to opt out at any time.
          - generic [ref=f41e100]:
            - heading "7. Prohibited Practices" [level=2] [ref=f41e101]
            - paragraph [ref=f41e102]: "Kesher's Terms of Service explicitly prohibit the following:"
            - list [ref=f41e103]:
              - listitem [ref=f41e104]: Sending SMS messages to recipients who have not explicitly consented
              - listitem [ref=f41e105]: Importing phone numbers sourced from purchased lists, web scraping, or any non-consented source
              - listitem [ref=f41e106]: Re-messaging recipients who have opted out
              - listitem [ref=f41e107]: Sending unsolicited commercial messages, spam, or marketing content unrelated to school communications
              - listitem [ref=f41e108]: Misrepresenting the sender identity or content of messages
            - paragraph [ref=f41e109]: Violations of these policies may result in immediate account suspension and removal from the Kesher platform.
          - generic [ref=f41e110]:
            - heading "8. Compliance References" [level=2] [ref=f41e111]
            - list [ref=f41e112]:
              - listitem [ref=f41e113]: CTIA Messaging Principles and Best Practices (current edition)
              - listitem [ref=f41e114]: The Campaign Registry (TCR) A2P 10DLC requirements
              - listitem [ref=f41e115]: Telephone Consumer Protection Act (TCPA), 47 U.S.C. § 227
              - listitem [ref=f41e116]: CAN-SPAM Act of 2003
              - listitem [ref=f41e117]: Family Educational Rights and Privacy Act (FERPA)
