              - generic [ref=f59e143]:
                - paragraph [ref=f59e144]: School exports consented numbers
                - paragraph [ref=f59e145]: After enrollment forms are collected, the school administrator exports the phone numbers of consented parents and guardians into a CSV file.
            - generic [ref=f59e146]:
              - generic [ref=f59e147]: "2"
              - generic [ref=f59e148]:
                - paragraph [ref=f59e149]: Administrator imports to Kesher with certification
                - paragraph [ref=f59e150]: The administrator uploads the CSV to Kesher. Before any numbers are saved, they must check a certification box confirming that all contacts have explicitly consented to receive SMS from the school.
            - generic [ref=f59e151]:
              - generic [ref=f59e152]: "3"
              - generic [ref=f59e153]:
                - paragraph [ref=f59e154]: Kesher records the import and consent certification
                - paragraph [ref=f59e155]: Kesher logs the import timestamp, the administrator's identity, and the certification acknowledgment. This creates an auditable consent trail.
            - generic [ref=f59e156]:
              - generic [ref=f59e157]: "4"
              - generic [ref=f59e158]:
                - paragraph [ref=f59e159]: School sends messages; STOP/HELP handled automatically
                - paragraph [ref=f59e160]: School administrators send campaigns through Kesher. Every message automatically includes opt-out instructions. STOP, HELP, and UNSTOP are processed in real time with no manual intervention.
