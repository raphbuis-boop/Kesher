                - paragraph [ref=f62e142]: School exports consented numbers
                - paragraph [ref=f62e143]: After enrollment forms are collected, the school administrator exports the phone numbers of consented parents and guardians into a CSV file.
            - generic [ref=f62e144]:
              - generic [ref=f62e145]: "2"
              - generic [ref=f62e146]:
                - paragraph [ref=f62e147]: Administrator imports to Kesher with certification
                - paragraph [ref=f62e148]: The administrator uploads the CSV to Kesher. Before any numbers are saved, they must check a certification box confirming that all contacts have explicitly consented to receive SMS from the school.
            - generic [ref=f62e149]:
              - generic [ref=f62e150]: "3"
              - generic [ref=f62e151]:
                - paragraph [ref=f62e152]: Kesher records the import and consent certification
                - paragraph [ref=f62e153]: Kesher logs the import timestamp, the administrator's identity, and the certification acknowledgment. This creates an auditable consent trail.
            - generic [ref=f62e154]:
              - generic [ref=f62e155]: "4"
              - generic [ref=f62e156]:
                - paragraph [ref=f62e157]: School sends messages; STOP/HELP handled automatically
                - paragraph [ref=f62e158]: School administrators send campaigns through Kesher. Every message automatically includes opt-out instructions. STOP, HELP, and UNSTOP are processed in real time with no manual intervention.
